<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Photobooth" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0a0f" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Heisterkamp Halloween 2026</title>
  </head>
  <body>
    <main id="app" data-screen="attract">
      <video id="preview" autoplay muted playsinline></video>
      <div class="shade"></div>

      <header class="top">
        <h1 id="title">Heisterkamp Halloween 2026</h1>
      </header>

      <!-- Waiting for a guest -->
      <section class="screen" data-for="attract">
        <button id="settings-btn" class="gear" type="button" aria-label="Booth settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.700 7.700 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.100.7 1.700 1l.4 2.600c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.600c.6-.3 1.200-.6 1.700-1l2.500 1c.2.1.5 0 .6-.2l2-3.500a.5.5 0 0 0-.1-.6L19.400 13zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z" />
          </svg>
        </button>
        <div class="timer-picker" role="radiogroup" aria-label="Timer">
          <span class="timer-label">Timer</span>
          <button type="button" class="timer-chip" role="radio" data-seconds="3" aria-checked="true">3s</button>
          <button type="button" class="timer-chip" role="radio" data-seconds="7" aria-checked="false">7s</button>
          <button type="button" class="timer-chip" role="radio" data-seconds="10" aria-checked="false">10s</button>
        </div>
        <button id="start" class="big-button" type="button">
          <svg viewBox="0 0 64 64" aria-hidden="true" class="ghost">
            <path d="M32 6c-12 0-20 9-20 21v27l6-5 6 5 6-5 4 0 6 5 6-5 6 5V27C52 15 44 6 32 6z" />
            <circle cx="25" cy="28" r="4" class="eye" />
            <circle cx="39" cy="28" r="4" class="eye" />
            <ellipse cx="32" cy="40" rx="4" ry="5" class="eye" />
          </svg>
          <span>Tap to take a photo</span>
        </button>
      </section>

      <!-- Countdown -->
      <section class="screen" data-for="countdown">
        <div id="count" aria-live="assertive"></div>
        <!-- A ghost swoops across during the last second -->
        <div id="pop" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path d="M32 6c-12 0-20 9-20 21v27l6-5 6 5 6-5 4 0 6 5 6-5 6 5V27C52 15 44 6 32 6z" />
            <circle cx="25" cy="28" r="4" class="eye" />
            <circle cx="39" cy="28" r="4" class="eye" />
            <ellipse cx="32" cy="40" rx="4" ry="5" class="eye" />
          </svg>
        </div>
      </section>

      <!-- Review the framed photo -->
      <section class="screen" data-for="review">
        <div class="photo-stack">
          <img id="result" alt="Your photo" />
          <!-- Random mode: the version with the ghost fades in over the plain photo -->
          <img id="result-ghost" alt="" aria-hidden="true" />
        </div>
        <div class="tools">
        <button id="ghost" class="pill ghost-toggle" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 6c-12 0-20 9-20 21v27l6-5 6 5 6-5 4 0 6 5 6-5 6 5V27C52 15 44 6 32 6z" />
            <circle cx="25" cy="28" r="4" class="eye" />
            <circle cx="39" cy="28" r="4" class="eye" />
          </svg>
          <span>Add a ghost</span>
        </button>
        <button id="hd" class="pill hd-save" type="button" hidden>Save HD</button>
        </div>
        <div class="actions">
          <button id="retake" class="pill" type="button">Retake</button>
          <button id="print" class="pill primary" type="button">Print</button>
          <button id="done" class="pill" type="button">Done</button>
        </div>
      </section>

      <!-- After sending to the printer -->
      <section class="screen" data-for="sent">
        <div class="message">
          <p class="spooky">Boo-tiful!</p>
          <p>Your print is on its way.</p>
        </div>
      </section>

      <!-- Camera or other problem -->
      <section class="screen" data-for="error">
        <div class="message">
          <p class="spooky">Uh oh</p>
          <p id="error-text">Something went wrong.</p>
          <button id="retry" class="pill primary" type="button">Try again</button>
        </div>
      </section>

      <div id="flash"></div>
    </main>

    <dialog id="settings">
      <form method="dialog">
        <h2>Booth settings</h2>
        <label>Text on print and screen <input name="title" maxlength="40" /></label>
        <label>
          Default timer (guests can change it on the main screen)
          <select name="countdown">
            <option value="3">3 seconds</option>
            <option value="7">7 seconds</option>
            <option value="10">10 seconds</option>
          </select>
        </label>
        <label>
          Photo rotation (only if prints come out sideways)
          <select name="rotation">
            <option value="none">Normal</option>
            <option value="cw">Turn right</option>
            <option value="ccw">Turn left</option>
          </select>
        </label>
        <label>
          Ghost cameo
          <select name="ghost">
            <option value="toggle">Guests tap to add it</option>
            <option value="random">Random surprise (about 60% of photos)</option>
            <option value="off">Off</option>
          </select>
        </label>
        <label>
          Photo edges
          <select name="edges">
            <option value="soft">Soft, fades into the border</option>
            <option value="sharp">Sharp, with a thin outline</option>
          </select>
        </label>
        <label>
          Save HD button (4K copy for AirDrop or Photos)
          <select name="hd">
            <option value="show">Show it</option>
            <option value="hide">Hide it</option>
          </select>
        </label>
        <p id="cam-info" class="note"></p>
        <div class="row">
          <button value="reload" type="submit" class="pill">Reload app</button>
          <button value="save" type="submit" class="pill primary">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
